title: neurons.me
description: Shared docs home and remote theme source for .me.
theme: minima
# url is the host only; the project path goes in baseurl. With the path in
# url, GitHub Pages also injected baseurl=/neurons-me, so the canonical and
# og:url came out as /neurons-me//neurons-me/ (a 404).
url: https://neurons-me.github.io
baseurl: "/neurons-me"

markdown: kramdown
kramdown:
  input: GFM
  parse_block_html: true
  hard_wrap: false

me_theme:
  brand: neurons.me
  nav:
    - label: Home
      url: https://neurons-me.github.io/
    - label: Github
      url: https://github.com/neurons-me
    - label: .me
      relative_url: https://neurons-me.github.io/.me
