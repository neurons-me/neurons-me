<svg viewBox="0 0 480 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">me.whatever(what)</title>
  <desc id="desc">me.a(2); me.x(4); me[&quot;=&quot;](&quot;y&quot;, &quot;a * x&quot;); me(&quot;y&quot;) → 8.</desc>
  <style>
    svg { --ink:#24292f; --me:#0969da; --str:#0a7d3f; --num:#b45309; --com:#6b7280; --sun:#c69026; --mut:#656d76; }
    @media (prefers-color-scheme: dark) {
      svg { --ink:#c9d1d9; --me:#58a6ff; --str:#86efac; --num:#fbbf24; --com:#8b949e; --sun:#d29922; --mut:#8b949e; }
    }
    text { font: 15px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
  </style>
    <text x="4" y="22"><tspan fill="var(--me)">me</tspan><tspan fill="var(--ink)">.a(</tspan><tspan fill="var(--num)">2</tspan><tspan fill="var(--ink)">);</tspan></text>
    <text x="4" y="48"><tspan fill="var(--me)">me</tspan><tspan fill="var(--ink)">.x(</tspan><tspan fill="var(--num)">4</tspan><tspan fill="var(--ink)">);</tspan></text>
    <text x="4" y="74"><tspan fill="var(--me)">me</tspan><tspan fill="var(--ink)">[</tspan><tspan fill="var(--str)">&quot;=&quot;</tspan><tspan fill="var(--ink)">](</tspan><tspan fill="var(--str)">&quot;y&quot;</tspan><tspan fill="var(--ink)">, </tspan><tspan fill="var(--str)">&quot;a * x&quot;</tspan><tspan fill="var(--ink)">);</tspan></text>
    <text x="4" y="112"><tspan fill="var(--me)">me</tspan><tspan fill="var(--ink)">(</tspan><tspan fill="var(--str)">&quot;y&quot;</tspan><tspan fill="var(--ink)">);</tspan></text>
    <text x="200" y="112" text-anchor="start" fill="var(--mut)">→</text>
    <text x="228" y="112" font-style="italic" fill="var(--sun)" font-size="20" font-family="Georgia, 'DejaVu Serif', serif">8</text>
</svg>
