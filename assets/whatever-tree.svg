<svg viewBox="20 0 460 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">me.whatever(what)</title>
  <desc id="desc">Three paths from me: a(2), b(3), x(4). Derivation me[&quot;=&quot;](&quot;y&quot;, &quot;a * x + b&quot;) equals 11.</desc>
