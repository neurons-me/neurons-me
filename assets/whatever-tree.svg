<svg viewBox="0 0 380 128" width="380" height="128" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">me.whatever(what)</title>
  <desc id="desc">A simple path of three nodes: me, whatever (letter), what (b) — me.letter("b").</desc>
  <style>
    svg { --ink:#1f2328; --mut:#57606a; --line:rgba(127,127,127,.4); --bg:#ffffff; --me:#0969da; --sun:#c69026; }
    @media (prefers-color-scheme: dark) {
      svg { --ink:#c9d1d9; --mut:#8b949e; --line:rgba(127,127,127,.42); --bg:#0d1117; --me:#58a6ff; --sun:#d29922; }
    }
  </style>
  <g stroke="var(--line)" stroke-width="1.4" fill="none">
    <path d="M60 52 H126"/>
    <path d="M194 52 H268"/>
  </g>
  <g fill="var(--bg)" stroke="var(--mut)" stroke-width="1.4">
    <circle cx="40" cy="52" r="20"/>
    <circle cx="160" cy="52" r="34"/>
  </g>
  <circle cx="300" cy="52" r="32" fill="var(--bg)" stroke="var(--sun)" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <text x="40" y="57" font-size="15" fill="var(--me)">me</text>
    <text x="160" y="57" font-size="14" fill="var(--ink)">letter</text>
    <text x="160" y="104" font-size="13" letter-spacing=".4" fill="var(--mut)">whatever</text>
    <text x="300" y="102" font-size="13" letter-spacing=".4" fill="var(--sun)">what</text>
  </g>
  <text x="300" y="59" font-family="Georgia, 'DejaVu Serif', serif" font-style="italic" font-size="22" text-anchor="middle" fill="var(--ink)">b</text>
</svg>
